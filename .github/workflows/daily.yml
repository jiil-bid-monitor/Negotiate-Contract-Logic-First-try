name: 나라장터 공고 수집

# 실행 방법
#  · 수동: GitHub 저장소 → Actions 탭 → 이 워크플로 선택 → "Run workflow"
#  · 자동 스케줄 (2026-10-12 사용자 결정: 입찰은 매일, 나머지는 매주 텔레그램으로):
#      매일 09:00 KST — 어제 게시된 "입찰" → 텔레그램   (2026-10-14 사용자 요청으로 08:00 → 09:00)
#      매주 월 09:10 KST — 지난 7일 "협상·규격가격동시입찰" + 사전규격 → 텔레그램
#    ※ GitHub 예약 실행은 붐비면 몇 시간씩 늦게 시작한다(실측 10/13 08:00 예약 → 12:21 시작, 10/14 → 10:35 시작).
#    조회 기간을 날짜 단위로 딱 잘라(--complete-days) 주기끼리 겹치지 않으므로
#    같은 공고가 두 번 잡히지 않는다. 스케줄은 **기본 브랜치(main)에 이 파일이 있어야** 돈다.
#    스케줄 실행도 Supabase 저장은 하지 않는다(9/28 "저장은 수집 기능 완성 후" 결정 유지 —
#    켜려면 아래 "실행 모드 결정"의 스케줄 쪽 NO_SUPABASE를 "false"로).
#    수동 실행은 telegram 입력이 true일 때만 보낸다.
#
# 수집이 실패하면(나라장터 접속 끊김 등) 60분 뒤 새 Run으로 다시 시도한다 — 최대 5회(약 4시간).
#   담당자 방에는 실패 알림을 보내지 않는다. 개발자 방(TELEGRAM_DEV_CHAT_ID)에만
#   ① 5회 모두 실패했을 때 ② 재시도 끝에 성공했을 때 알린다 (2026-10-12 사용자 결정).
#
# 필요한 저장소 secrets: NARA_SERVICE_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (텔레그램 두 개가 없으면 발송만 건너뜀),
#   TELEGRAM_DEV_CHAT_ID (선택 — 개발자 알림 방. 없으면 개발자 알림만 건너뜀)
on:
  schedule:
    - cron: "0 0 * * *"     # 00:00 UTC = 09:00 KST — 매일, 입찰
    - cron: "10 0 * * 1"    # 월 00:10 UTC = 월 09:10 KST — 주간, 협상·규격가격동시입찰·사전규격
  workflow_dispatch:
    inputs:
      categories:
        description: "공고 유형 (쉼표 구분: 협상, 규격가격동시입찰, 입찰). 비우면 전 유형"
        required: false
        default: ""
      complete_days:
        description: "오늘을 뺀 직전 N일을 날짜 단위로 조회 (예: 1=어제 하루). 비우면 아래 days 사용"
        required: false
        default: ""
      days:
        description: "조회 기간(일, 오늘 포함). complete_days가 비었을 때만 쓴다. 비우면 1일"
        required: false
        default: "1"
      telegram:
        description: "true로 두면 결과를 텔레그램으로 발송"
        required: false
        default: "false"
      pre_spec:
        description: "true로 두면 사전규격도 같은 기간으로 수집 (주간 스케줄은 자동으로 켬)"
        required: false
        default: "false"
      no_supabase:
        description: "true(기본)면 Supabase에 저장하지 않고 리포트만 생성. 저장하려면 false — 저장은 수집 기능 완성 후 켜기로 함"
        required: false
        default: "true"
      attempt:
        description: "재시도 회차 (자동 재시도가 채워넣는 값 — 직접 실행할 땐 비워두면 1)"
        required: false
        default: "1"
      verify:
        description: "true로 두면 수집 대신 `nego --verify`(응답 필드명 진단)만 실행하고 끝낸다"
        required: false
        default: "false"
      llm_similarity:
        description: "true로 두면 후보 공고를 과거 실적과 Claude API로 유사도 판정한다 (secrets.ANTHROPIC_API_KEY 필요)"
        required: false
        default: "false"
      # (workflow_dispatch 입력은 최대 10개 — 이게 10번째)
      dev_test:
        description: "true로 두면 수집 없이 개발자 방(TELEGRAM_DEV_CHAT_ID)에 시험 알림만 보내고 끝낸다"
        required: false
        default: "false"

# 실패 시 같은 워크플로를 workflow_dispatch로 재호출해 새 Run을 큐에 올리려면
# GITHUB_TOKEN에 actions:write 권한이 있어야 한다.
permissions:
  contents: read
  actions: write

env:
  # 러너 기본 시간대는 UTC다. 조회 기간("어제")·잔여일수(D-N)를 한국 날짜로 계산하려면
  # 한국 시간대로 돌려야 한다 — 안 그러면 UTC 날짜 기준이라 실행 시각에 따라 "어제"가 한국 기준과
  # 하루 어긋날 수 있다(예약 실행이 늦게 시작하거나 수동 실행할 때).
  TZ: Asia/Seoul
  # 실패 후 다음 시도까지 기다리는 시간(분). 나라장터 접속 끊김은 몇 시간 이어질 수 있어서
  # 바로 다시 하지 않고 간격을 둔다 (10/7 팀원 시스템 사례 — 몇 시간 뒤 정상화).
  RETRY_DELAY_MINUTES: "60"
  MAX_ATTEMPTS: "5"

jobs:
  collect:
    runs-on: ubuntu-latest
    # days를 30일보다 길게 잡으면 API 조회가 여러 번(30일 단위)으로 나뉘어
    # 그만큼 오래 걸린다 — 실측 30일 기준 약 26분이라 여유 있게 잡는다.
    timeout-minutes: 90
    # 아래 retry 잡이 같은 실행 모드로 새 Run을 띄울 때 쓴다
    outputs:
      failed: ${{ steps.fail.outputs.failed }}
      categories: ${{ steps.mode.outputs.categories }}
      complete_days: ${{ steps.mode.outputs.complete_days }}
      days: ${{ steps.mode.outputs.days }}
      telegram: ${{ steps.mode.outputs.telegram }}
      prespec: ${{ steps.mode.outputs.prespec }}
      no_supabase: ${{ steps.mode.outputs.no_supabase }}
      llm: ${{ steps.mode.outputs.llm }}
      attempt: ${{ steps.mode.outputs.attempt }}

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 테스트
        run: python -m unittest discover -s tests -t .

      # 스케줄 실행에는 입력값이 없으므로 여기서 실행 모드를 정한다. 수동 실행은
      # 입력값을 그대로 쓴다. 아래 수집·재시도 단계는 모두 이 출력값만 본다.
      - name: 실행 모드 결정
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_CATEGORIES: ${{ github.event.inputs.categories }}
          IN_COMPLETE_DAYS: ${{ github.event.inputs.complete_days }}
          IN_DAYS: ${{ github.event.inputs.days }}
          IN_TELEGRAM: ${{ github.event.inputs.telegram }}
          IN_PRESPEC: ${{ github.event.inputs.pre_spec }}
          IN_NO_SUPABASE: ${{ github.event.inputs.no_supabase }}
          IN_LLM: ${{ github.event.inputs.llm_similarity }}
          IN_ATTEMPT: ${{ github.event.inputs.attempt }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            if [ "$SCHEDULE" = "10 0 * * 1" ]; then
              CATEGORIES="협상,규격가격동시입찰"; COMPLETE_DAYS="7"; PRESPEC="true"
            else
              CATEGORIES="입찰"; COMPLETE_DAYS="1"; PRESPEC="false"
            fi
            DAYS="1"; TELEGRAM="true"; NO_SUPABASE="true"; LLM="false"; ATTEMPT="1"
          else
            CATEGORIES="$IN_CATEGORIES"; COMPLETE_DAYS="$IN_COMPLETE_DAYS"
            DAYS="${IN_DAYS:-1}"; TELEGRAM="${IN_TELEGRAM:-false}"; PRESPEC="${IN_PRESPEC:-false}"
            NO_SUPABASE="${IN_NO_SUPABASE:-true}"; LLM="${IN_LLM:-false}"; ATTEMPT="${IN_ATTEMPT:-1}"
          fi
          {
            echo "categories=$CATEGORIES"
            echo "complete_days=$COMPLETE_DAYS"
            echo "days=$DAYS"
            echo "telegram=$TELEGRAM"
            echo "prespec=$PRESPEC"
            echo "no_supabase=$NO_SUPABASE"
            echo "llm=$LLM"
            echo "attempt=$ATTEMPT"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$COMPLETE_DAYS" ]; then PERIOD="오늘 뺀 직전 ${COMPLETE_DAYS}일"; else PERIOD="최근 ${DAYS}일"; fi
          echo "유형=${CATEGORIES:-전체} / 기간=${PERIOD} / 사전규격=$PRESPEC / 텔레그램=$TELEGRAM / 시도 ${ATTEMPT}회차"

      # 필드명이 비어 보이거나(예: 예가방법에 해당하는 실제 필드명을 모를 때)
      # 원본 응답을 직접 봐야 할 때 쓰는 1회성 진단. 이 스텝을 타면 아래
      # 수집 실행/업로드는 건너뛴다 — Supabase에 아무것도 쓰지 않는다.
      - name: API 필드명 진단 (verify=true일 때만)
        if: github.event.inputs.verify == 'true'
        env:
          NARA_SERVICE_KEY: ${{ secrets.NARA_SERVICE_KEY }}
        run: python -m nego --verify

      # 개발자 방은 실패가 나야 알림이 가서, 연결만 확인하는 시험 알림 (dev_test=true일 때만, 수집 안 함)
      - name: 개발자 방 시험 알림 (dev_test=true일 때만)
        if: github.event.inputs.dev_test == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_DEV_CHAT_ID: ${{ secrets.TELEGRAM_DEV_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -m nego.telegram dev-alert "$(printf '[개발자 알림] 시험 메시지입니다 (실제 오류 아님).\n앞으로 수집이 %s번 모두 실패하거나, 재시도 끝에 성공하면 이 방으로 알림이 옵니다.\n\n로그: %s' "$MAX_ATTEMPTS" "$RUN_URL")"

      - name: 수집 실행
        id: collect
        if: github.event.inputs.verify != 'true' && github.event.inputs.dev_test != 'true'
        continue-on-error: true
        env:
          NARA_SERVICE_KEY: ${{ secrets.NARA_SERVICE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_TABLE: ${{ vars.SUPABASE_TABLE }}
          LOOKBACK_DAYS: ${{ steps.mode.outputs.days }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CATEGORIES: ${{ steps.mode.outputs.categories }}
          COMPLETE_DAYS: ${{ steps.mode.outputs.complete_days }}
          TELEGRAM: ${{ steps.mode.outputs.telegram }}
          PRESPEC: ${{ steps.mode.outputs.prespec }}
          NO_SUPABASE: ${{ steps.mode.outputs.no_supabase }}
          LLM: ${{ steps.mode.outputs.llm }}
        run: |
          # 후보 공고 첨부파일(HWP/HWPX/PDF)까지 자동으로 텍스트 추출한다
          # (지역제한/면허제한/공동수급을 원문과 대조하기 위함). 담당자 연락처는
          # nego/attachments.py가 저장 전에 마스킹한다.
          ARGS=(--fetch-attachment-text)
          [ -n "$CATEGORIES" ] && ARGS+=(--categories "$CATEGORIES")
          [ -n "$COMPLETE_DAYS" ] && ARGS+=(--complete-days "$COMPLETE_DAYS")
          [ "$TELEGRAM" = "true" ] && ARGS+=(--telegram)
          [ "$PRESPEC" = "true" ] && ARGS+=(--pre-spec)
          [ "$NO_SUPABASE" = "true" ] && ARGS+=(--no-supabase)
          [ "$LLM" = "true" ] && ARGS+=(--llm-similarity)
          # 개발자 알림에 마지막 오류 줄을 붙이려고 로그를 파일로도 남긴다(output/ 밖 — 아티팩트에 안 올림)
          set -o pipefail
          python -m nego "${ARGS[@]}" 2>&1 | tee collect.log

      # 수집 원문(data/)은 올리지 않는다 — 담당자 연락처가 섞일 수 있다.
      # 리포트(output/)만 아티팩트로 남긴다.
      - name: 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nego-report-${{ github.run_id }}
          path: output/
          retention-days: 90
          if-no-files-found: ignore

      # 개발자 알림 — 담당자 방이 아니라 TELEGRAM_DEV_CHAT_ID로만. 알림이 실패해도 Run 결과는 그대로.
      - name: 개발자 알림 (재시도 소진 · 회복)
        if: >-
          (steps.collect.outcome == 'failure' && fromJSON(steps.mode.outputs.attempt) >= fromJSON(env.MAX_ATTEMPTS))
          || (steps.collect.outcome == 'success' && fromJSON(steps.mode.outputs.attempt) > 1)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_DEV_CHAT_ID: ${{ secrets.TELEGRAM_DEV_CHAT_ID }}
          OUTCOME: ${{ steps.collect.outcome }}
          EVENT: ${{ github.event_name }}
          CATEGORIES: ${{ steps.mode.outputs.categories }}
          COMPLETE_DAYS: ${{ steps.mode.outputs.complete_days }}
          DAYS: ${{ steps.mode.outputs.days }}
          TELEGRAM: ${{ steps.mode.outputs.telegram }}
          ATTEMPT: ${{ steps.mode.outputs.attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$COMPLETE_DAYS" ]; then PERIOD="오늘 뺀 직전 ${COMPLETE_DAYS}일"; else PERIOD="최근 ${DAYS}일"; fi
          MODE="${CATEGORIES:-전체 유형} · ${PERIOD}"
          if [ "$OUTCOME" = "failure" ]; then
            ERRORS=$( (grep -E " ERROR |Error|조회 실패" collect.log 2>/dev/null || true) | tail -5 | cut -c1-300)
            [ -z "$ERRORS" ] && ERRORS="(오류 줄 없음 — Actions 로그 확인)"
            WAITED=$(( (ATTEMPT - 1) * RETRY_DELAY_MINUTES ))
            REPORT="담당자 보고는 나가지 않았습니다."
            [ "$TELEGRAM" != "true" ] && REPORT="(텔레그램 발송을 켜지 않은 실행)"
            TEXT=$(printf '[개발자 알림] 나라장터 수집 실패 — %s회 모두 실패\n%s\n첫 시도 후 약 %s분 동안 재시도. %s\n\n마지막 오류:\n%s\n\n로그: %s' \
              "$ATTEMPT" "$MODE" "$WAITED" "$REPORT" "$ERRORS" "$RUN_URL")
          else
            REPORT="담당자 보고 발송됨."
            [ "$TELEGRAM" != "true" ] && REPORT="(텔레그램 발송을 켜지 않은 실행)"
            TEXT=$(printf '[개발자 알림] 나라장터 수집 회복 — %s번째 시도에서 성공\n%s\n%s\n\n로그: %s' \
              "$ATTEMPT" "$MODE" "$REPORT" "$RUN_URL")
          fi
          python -m nego.telegram dev-alert "$TEXT"

      - name: 재시도 소진
        if: steps.collect.outcome == 'failure' && fromJSON(steps.mode.outputs.attempt) >= fromJSON(env.MAX_ATTEMPTS)
        run: echo "::error::${{ steps.mode.outputs.attempt }}번째 시도에서도 실패 — 최대 재시도 소진, 자동 재시도를 중단합니다."

      - name: 실패 처리
        id: fail
        if: steps.collect.outcome == 'failure'
        run: |
          echo "failed=true" >> "$GITHUB_OUTPUT"
          exit 1

  # 용역/물품/공사 중 하나라도 API 재시도를 다 소진하면 nego/pipeline.py가 전체 실행을 실패로
  # 처리한다(부분 데이터로 리포트를 내지 않는다). 그럴 때 RETRY_DELAY_MINUTES만큼 기다렸다가 같은
  # 실행 모드로 새 Run을 큐에 올린다 — 스케줄 실행이 실패해도 입력값으로 모드를 넘겨주므로 재시도
  # Run도 같은 유형·기간으로 돈다(조회 기간은 날짜 단위라 몇 시간 뒤에 돌아도 같다).
  # 기다리는 동안 러너 시간이 든다(실패한 날만, 회당 약 60분).
  retry:
    needs: collect
    if: always() && needs.collect.outputs.failed == 'true' && fromJSON(needs.collect.outputs.attempt) < 5
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: 다음 시도까지 대기
        run: |
          echo "수집 실패 — ${RETRY_DELAY_MINUTES}분 뒤 $(( ${{ needs.collect.outputs.attempt }} + 1 ))번째 시도를 큐에 올립니다."
          sleep $(( RETRY_DELAY_MINUTES * 60 ))

      - name: 새 Run 재시도 예약
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          CATEGORIES: ${{ needs.collect.outputs.categories }}
          COMPLETE_DAYS: ${{ needs.collect.outputs.complete_days }}
          DAYS: ${{ needs.collect.outputs.days }}
          TELEGRAM: ${{ needs.collect.outputs.telegram }}
          PRESPEC: ${{ needs.collect.outputs.prespec }}
          NO_SUPABASE: ${{ needs.collect.outputs.no_supabase }}
          LLM: ${{ needs.collect.outputs.llm }}
          ATTEMPT: ${{ needs.collect.outputs.attempt }}
        run: |
          NEXT_ATTEMPT=$(( ATTEMPT + 1 ))
          BODY=$(jq -n \
            --arg ref "$REF" --arg categories "$CATEGORIES" --arg complete_days "$COMPLETE_DAYS" \
            --arg days "$DAYS" --arg telegram "$TELEGRAM" --arg pre_spec "$PRESPEC" --arg no_supabase "$NO_SUPABASE" \
            --arg llm "$LLM" --arg attempt "$NEXT_ATTEMPT" \
            '{ref: $ref, inputs: {categories: $categories, complete_days: $complete_days, days: $days,
              telegram: $telegram, pre_spec: $pre_spec, no_supabase: $no_supabase, llm_similarity: $llm, attempt: $attempt}}')
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/daily.yml/dispatches" \
            -d "$BODY"
          echo "${NEXT_ATTEMPT}번째 시도 Run을 큐에 올렸습니다."
