# Synology Container Manager → 프로젝트 → 생성 → 경로를 이 폴더로 고르면 이 파일을 그대로 쓴다.
# NAS 폴더 배치 (이 레포 옆에 jiil-past-contracts — 싱크로율 과거 실적):
#   <공유폴더>/jiil-webapp/Negotiate-Contract-Logic-First-try/   ← 이 파일, .env, data/, output/
#   <공유폴더>/jiil-webapp/jiil-past-contracts/
#   <공유폴더>/jiil-webapp/control/     ← restart-webapp 파일을 넣으면 웹앱만 다시 켠다(scripts/nas/webapp_run.sh)
#   <공유폴더>/jiil-webapp/under100m/   ← run.sh를 넣으면 1억 미만 컨테이너가 실행한다(없으면 대기, 저장소 밖 — 회사 정보)
#   <공유폴더>/jiil-webapp/under100m/results/   ← 1억 미만 컨테이너의 시험 결과(공고 폴더). 실행할 때 저절로 생긴다.
services:
  webapp:
    build: .
    image: jiil-webapp:latest
    container_name: jiil-webapp
    command: ["sh", "scripts/nas/webapp_run.sh"]
    # host: 웹앱이 NAS의 8765에서 바로 접속을 받아 DSM 방화벽 규칙이 그대로 적용된다(포트 매핑 없음).
    network_mode: host
    restart: unless-stopped
    # 서비스키·접속 토큰 등 .env는 실행 스크립트가 켤 때마다 읽는다(scripts/nas/run_with_env.py, 깃에 안 올라감).
    environment:
      HOST: "0.0.0.0"
      PORT: "8765"
      # 서버 PC의 구글 드라이브 백업 폴더(Windows 경로)는 NAS에 없어 끈다.
      BACKUP_DIR: /work/backup  # 판단 기록 사본·날짜별 30일 — 토요일 HyperBackup 사이 보호(2026-11-09 사용자 결정)
    volumes:
      # 위 jiil-webapp 폴더 전체를 /work로 — 코드·data·output·과거 실적을 NAS 파일 그대로 읽고 쓴다.
      - ..:/work
    # NAS 메모리 4GB — 웹앱이 다른 NAS 기능을 밀어내지 않게 상한.
    mem_limit: 2g

  # 1억 미만 공고 자동화 — 관리자가 컨테이너를 한 번만 만들면 되게 미리 함께 만들어 둔다. run.sh가 생기기 전엔 대기만 한다.
  under100m:
    # image만 적으면 받아 오려다 실패할 수 있어 build도 같이 쓴다(같은 이미지).
    build: .
    image: jiil-webapp:latest
    container_name: jiil-under100m
    command: ["sh", "scripts/nas/under100m_run.sh"]
    network_mode: host
    restart: unless-stopped
    environment:
      # 시험 중엔 jiil-webapp 공유 폴더 안에만 쓴다. 정식 공유 폴더로 옮길 땐 연결을 추가한다(프로젝트 다시 빌드 필요).
      UNDER100M_OUT: /work/under100m/results
    volumes:
      - ..:/work
    mem_limit: 1500m
